name: Natgas weather extras
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['research/fetch_wx2.py', '.github/workflows/wx2.yml']
  schedule:
    - cron: '47 0 * * *'
permissions: {contents: write}
concurrency: {group: ng-research, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests && python research/fetch_wx2.py
      - run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research; git diff --cached --quiet && exit 0
          git commit -qm "weather extras $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
