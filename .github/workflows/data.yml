name: Refresh market data

on:
  schedule:
    # 22:40 UTC on weekdays — after the US settle. GitHub cron is UTC and can
    # run late when the queue is busy; that is normal.
    - cron: "40 22 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance requests

      - name: Fetch
        run: python fetch_data.py

      - name: Commit
        run: |
          git config user.name  "data-bot"
          git config user.email "actions@github.com"
          git add -f data/prices.json data/options.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
