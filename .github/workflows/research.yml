name: Natgas research data
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['research/fetch_research.py', '.github/workflows/research.yml']
  schedule:
    - cron: '23 12 * * *'
permissions: {contents: write}
concurrency: {group: ng-research, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests && python research/fetch_research.py
      - run: python research/fetch_wx2.py || echo "wx2 partial"
      - run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research; git diff --cached --quiet && exit 0
          git commit -qm "research data $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
